[app]
profile = "local"

[audio]
source = "loopback"
frame_ms = 20
target_rate = 16000
speed = 1.0

[segment]
silence_ms = 450
min_speech_ms = 300
max_segment_s = 10.0
window_overlap_s = 1.5
utterance_max_s = 30.0
utterance_max_chars = 1000
audio_buffer_s = 30.0
preroll_ms = 200
draft_interval_ms = 900
vad_floor = 0.0003
vad_ratio = 3.0
# 旧 carry_* 配置仍兼容读取，但不再参与句子提交；预算使用 utterance_max_*。
# 可选旧语言切换短片段过滤；默认关闭。
semantic_heuristics = false

[asr]
provider = "qwen3-local"
language = ""
# 解码退化成复读/幻觉时兜底：尾部截断或整段丢弃，不送 MT
guard = true
guard_diversity = 0.30
guard_max_chars_per_s = 30.0
# 可选的本地 Silero 观测；不以低分拦截字幕，模型路径相对当前配置文件目录。
speech_evidence_mode = "off"
speech_evidence_model = ""
# 本机 Qwen3-ASR 已验证 30 s 请求；仅用于对齐歧义的限次补解码，常规窗口仍为 10 s。
repair_max_s = 30.0

[asr.providers.qwen3-local]
type = "openai-chat"
base_url = "http://127.0.0.1:18091"
model = "qwen3-asr"
max_tokens = 256
timeout_s = 30.0
# 实测：1.1 会在歌词段自造续写，1.05 既能解开死循环又不扰动正常段落
repeat_penalty = 1.05

[mt]
provider = "qwen3-local"
target_lang = "简体中文"
# 历史只给已提交的 ASR 原文，不给历史译文；两项任一为 0 即关闭历史
context_sentences = 2
context_max_chars = 2000
emit_interval_ms = 180
enabled = true

[mt.providers.qwen3-local]
type = "openai-chat"
base_url = "http://127.0.0.1:18092"
model = "qwen3.5-9b"
max_tokens = 256
draft_max_tokens = 96
timeout_s = 60.0
thinking = false

[mt.providers.deepseek]
type = "openai-chat"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"
max_tokens = 256
draft_max_tokens = 96
timeout_s = 60.0
thinking = false

[hub]
host = "127.0.0.1"
port = 8765
snapshot_size = 120
